<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ii-lock remastered</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>

<div class="transition in" id="transition">
  <div class="lock-orb"><span class="material sym">lock</span></div>
</div>

<div class="stage">

  <section class="card card-clock">
    <div class="clock-wrap">
      <svg class="clock" viewBox="0 0 260 260">
        <path class="face" id="facePath"></path>
        <g class="ticks" id="ticksG"></g>
        <g class="hands">
          <rect class="hand hand-min" id="handMin" x="0" y="-6" width="95" height="12" rx="6"/>
          <rect class="hand hand-hour" id="handHour" x="-10" y="-10" width="72" height="20" rx="10"/>
          <rect class="hand hand-sec" id="handSec" x="-1.5" y="-2" width="88" height="4" rx="2"/>
          <circle class="center-dot" cx="130" cy="130" r="3"/>
        </g>
        <path class="day-bubble" id="dayBubble"></path>
        <text class="day-text" id="dayText" x="42" y="42"></text>
        <rect class="month-bubble" id="monthBubble" width="68" height="44" rx="22" x="184" y="196" transform="rotate(-45 218 218)"></rect>
        <text class="month-text" id="monthText" x="218" y="218"></text>
      </svg>
      <div class="digital-overlay">
        <span id="digitalHH"></span>
        <span id="digitalMM"></span>
      </div>
    </div>
    <div class="locked-pill">
      <span class="material sym">lock</span>
      <span>Locked</span>
    </div>
  </section>

  <section class="card card-login">
    <div class="user-block">
      <div class="avatar" id="avatar"></div>
      <div class="username" id="username">Loading…</div>
    </div>
    <div class="password-block">
      <div class="pw-pill" id="pwPill">
        <div class="shapes" id="shapes"></div>
        <input type="password" id="pwInput" autocomplete="off" autofocus>
        <div class="placeholder" id="pwPlaceholder">Enter password</div>
      </div>
    </div>
  </section>

  <section class="card card-side">
    <div class="side-top">
      <div class="battery-row" id="batteryRow" style="display:none">
        <span class="material sym" id="batteryIcon">battery_android_full</span>
        <span class="battery-pct" id="batteryPct">--%</span>
      </div>
      <button class="session-btn" id="sessionBtn">
        <span class="material sym">desktop_windows</span>
        <span id="sessionName">Session</span>
      </button>
    </div>
    <div class="side-bottom">
      <div class="power-row">
        <button class="icon-btn" id="suspendBtn" title="Suspend">
          <span class="material sym">bedtime</span>
        </button>
        <button class="icon-btn" id="restartBtn" title="Restart">
          <span class="material sym">restart_alt</span>
        </button>
        <button class="icon-btn" id="shutdownBtn" title="Shutdown">
          <span class="material sym">power_settings_new</span>
        </button>
      </div>
      <button class="session-btn layout-btn" id="layoutBtn" title="Keyboard layout">
        <span class="material sym">keyboard</span>
        <span id="layoutName">en</span>
      </button>
    </div>
  </section>

</div>

<script src="js/main.js"></script>
</body>
</html>
